<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to Service...</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
        }
        .container { text-align: center; }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #00B900; /* LINE Green */
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p { font-size: 16px; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container">
        <div class="spinner"></div>
        <p>กำลังเข้าสู่ระบบ...</p>
    </div>

    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <script>
        // --- ส่วนการตั้งค่า ---
        const LIFF_ID = "2009845133-zoRYTkL9"; // เปลี่ยนเป็น LIFF ID ของคุณ
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxo9tg8RNQTnY3FGiZmiTnUeNT96J2sfbg2jOpnVvPiSJOrajKaaf5HApnCxqk4ZcJJ/exec"; // URL ของ GAS ที่ Deploy แล้ว

        async function main() {
            try {
                // 2. Initialize LIFF
                await liff.init({ liffId: LIFF_ID });

                // 3. ตรวจสอบการ Login
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    // 4. ดึง Profile เมื่อ Login แล้ว
                    const profile = await liff.getProfile();
                    
                    // 5. สร้าง Redirect URL พร้อมแนบ Parameter
                    // ใช้ URLSearchParams เพื่อช่วยเรื่องการเข้ารหัส (Encoding) ที่ปลอดภัยกว่า
                    const params = new URLSearchParams({
                        id: profile.userId,
                        name: profile.displayName,
                        img: profile.pictureUrl || ""
                    });

                    const redirectUrl = `${GAS_URL}?${params.toString()}`;
                    
                    // 6. ส่งผู้ใช้กลับไปยัง GAS
                    window.location.href = redirectUrl;
                }
            } catch (err) {
                console.error("LIFF Error:", err);
                document.querySelector('p').innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อ LINE";
            }
        }

        main();
    </script>
</body>
</html>
